name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify the release
        run: |
          npm run typecheck
          npm test
          npm run build
          npm pack --dry-run

      - name: Publish to npm
        run: npm publish
        env:
          # Used only to bootstrap the first publication. Thereafter npm prefers
          # the OIDC trusted publisher authorized for this workflow.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
